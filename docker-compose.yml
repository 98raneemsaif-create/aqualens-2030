name: aqualens2030

services:
  kafka:
    image: apache/kafka:4.2.1@sha256:2d2f77837385f202b1947fc3ed62421de344f0ced47dde360ca5afdad11b51fa
    platform: linux/amd64
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: aqualens2030-airflow:phase-a
    platform: linux/amd64
    command: ["standalone"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AIRFLOW_HOME: /opt/airflow/runtime
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/runtime/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/runtime/logs
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__OPENLINEAGE__DISABLED: "false"
      AIRFLOW__OPENLINEAGE__NAMESPACE: aqualens2030
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type":"file","log_file_path":"/opt/airflow/docs/evidence/lineage/raw/event","append":false}'
      AIRFLOW__OPENLINEAGE__EXECUTE_IN_THREAD: "true"
      AIRFLOW__OPENLINEAGE__EMISSION_POLICY: "[]"
      PYTHONPATH: /opt/airflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HF_HOME: /opt/airflow/storage/models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /opt/airflow/storage/models/sentence-transformers
      TORCH_HOME: /opt/airflow/storage/models/torch
      XDG_CACHE_HOME: /opt/airflow/storage/cache
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow_runtime:/opt/airflow/runtime
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./data/source:/opt/airflow/data/source:ro
      - ./rag/sources:/opt/airflow/rag/sources:ro
      - ./tests:/opt/airflow/tests:ro
      - ./requirements:/opt/airflow/requirements:ro
      - ./docs/evidence:/opt/airflow/docs/evidence
      - ./storage:/opt/airflow/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health',timeout=5)); assert d['metadatabase']['status']=='healthy' and d['scheduler']['status']=='healthy'"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 120s
    mem_limit: 5g
    cpus: 2.0
    stop_grace_period: 60s

volumes:
  kafka_data:
  airflow_runtime:
